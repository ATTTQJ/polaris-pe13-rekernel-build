name: Experimental freezer V2 and ReKernel build
on:
  push:
    paths:
      - '.github/workflows/freezer-v2-experimental.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-16 lld-16 llvm-16 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev bc bison flex device-tree-compiler cpio
      - name: Fetch pinned sources and freezer history
        shell: bash
        run: |
          set -euxo pipefail
          git init kernel
          git -C kernel remote add pixel https://github.com/PixelExperience-Devices/kernel_xiaomi_polaris.git
          git -C kernel fetch --depth=1 pixel dce351ed301019553d148266a62fd3274f69ff22
          git -C kernel checkout --detach FETCH_HEAD
          git -C kernel remote add reference https://github.com/JackA1ltman/kernel_xiaomi_sdm845_binder_cgroup_v2.git
          git -C kernel fetch --depth=220 reference vic-cgroup-v2-freezer
          git init rekernel
          git -C rekernel remote add origin https://github.com/Sakion-Team/Re-Kernel.git
          git -C rekernel fetch --depth=1 origin ac08296174d7fb2801c0eee1084f067a34f8a0fe
          git -C rekernel checkout --detach FETCH_HEAD
          git -C rekernel apply "$GITHUB_WORKSPACE/integration/experimental-wire8.patch"
      - name: Apply ordered freezer backports
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail
          git config user.name "Port trial"
          git config user.email "port-trial@users.noreply.github.com"
          git cherry-pick 8c4adaef9b4678aca23eb948792fbbfeb8602aa2 bc14bf49e 258feb942
          git rev-list --reverse --first-parent '264b4ae44^..fc0e2d79e89c29d6f18b57856a29fd16a476abb7' > ../series.txt
          while read -r commit; do
            echo "Applying $commit" | tee -a ../port.log
            if ! git cherry-pick --allow-empty "$commit" 2>&1 | tee -a ../port.log; then
              git status --short | tee -a ../port.log
              conflicts=$(git diff --name-only --diff-filter=U)
              echo "$conflicts" | tee -a ../port.log
              if [ "$commit" = 12ac3f5695ad6410687d416b6d59a4a792665eb0 ] && [ "$conflicts" = include/linux/sched/sysctl.h ]; then
                python3 -c 'import pathlib; p=pathlib.Path("include/linux/sched/sysctl.h"); s=p.read_text(); a=s.index("<<<<<<< HEAD\n"); b=s.index(">>>>>>> 12ac3f569",a); e=s.index("\n",b); p.write_text(s[:a]+"#endif /* _LINUX_SCHED_SYSCTL_H */\n"+s[e+1:])'
                git add include/linux/sched/sysctl.h
              elif [ "$commit" = 861515fe25d09c148481963ef1a6f9e32b04f149 ] && [ "$conflicts" = kernel/signal.c ]; then
                python3 -c 'import pathlib; p=pathlib.Path("kernel/signal.c"); s=p.read_text(); a=s.index("<<<<<<< HEAD\n"); b=s.index(">>>>>>> 861515fe2",a); e=s.index("\n",b); p.write_text(s[:a]+"#include <linux/cgroup.h>\n"+s[e+1:])'
                git add kernel/signal.c
              else
                exit 1
              fi
              GIT_EDITOR=true git cherry-pick --continue 2>&1 | tee -a ../port.log
            fi
          done < ../series.txt
      - name: Integrate ReKernel
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail
          python3 -c 'import pathlib; p=pathlib.Path("fs/kernfs/mount.c"); s=p.read_text(); a="mutex_lock(&d_inode(dentry)->i_mutex);"; b="mutex_unlock(&d_inode(dentry)->i_mutex);"; assert s.count(a)==1 and s.count(b)==1; p.write_text(s.replace(a,"inode_lock(d_inode(dentry));").replace(b,"inode_unlock(d_inode(dentry));"))'
          git add fs/kernfs/mount.c
          git commit -m "Adapt inode locking to PixelExperience 4.9"
          git cherry-pick 8885cb277e5b53eb65ea81bca3d26e45eaeb0b1e
          if ! git cherry-pick 34bd8534a6a9ef3155e9dad8500f7d002ffd42b2; then
            test "$(git diff --name-only --diff-filter=U)" = fs/kernfs/mount.c
            git checkout --ours -- fs/kernfs/mount.c
            git add fs/kernfs/mount.c
            GIT_EDITOR=true git cherry-pick --continue
          fi
          grep -q '^int subsys_cgroup_allow_attach' kernel/cgroup/cgroup.c
          bash "$GITHUB_WORKSPACE/rekernel/Integrate/patches.sh"
          git apply "$GITHUB_WORKSPACE/integration/experimental-tcp-hooks.patch"
          grep -q 'rekernel_binder_transaction' drivers/android/binder.c
          grep -q 'rekernel_report' kernel/signal.c
          grep -q 'rekernel_tcp_notify(sk, skb, 4)' net/ipv4/tcp_ipv4.c
          grep -q 'rekernel_tcp_notify(sk, skb, 6)' net/ipv6/tcp_ipv6.c
          grep -q 'JOBCTL_TRAP_FREEZE' include/linux/sched.h
      - name: Build focused kernel objects
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail
          export PATH=/usr/lib/llvm-16/bin:$PATH ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-
          args=(O=out CC=clang-16 LD=ld.lld-16 AR=llvm-ar-16 NM=llvm-nm-16 OBJCOPY=llvm-objcopy-16 OBJDUMP=llvm-objdump-16 STRIP=llvm-strip-16)
          make "${args[@]}" polaris_defconfig
          scripts/config --file out/.config --set-str LOCALVERSION '-Etude-Op.13-No.2-codex-v2test' --enable REKERNEL --enable REKERNEL_NETWORK
          make "${args[@]}" olddefconfig
          grep -qx 'CONFIG_REKERNEL=y' out/.config
          grep -qx 'CONFIG_REKERNEL_NETWORK=y' out/.config
          make -j4 "${args[@]}" kernel/cgroup/cgroup.o kernel/cgroup/freezer.o kernel/signal.o drivers/android/binder.o drivers/rekernel/rekernel.o 2>&1 | tee ../build.log
      - name: Build complete experimental image
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail
          export PATH=/usr/lib/llvm-16/bin:$PATH ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-
          args=(O=out CC=clang-16 LD=ld.lld-16 AR=llvm-ar-16 NM=llvm-nm-16 OBJCOPY=llvm-objcopy-16 OBJDUMP=llvm-objdump-16 STRIP=llvm-strip-16)
          make -k -j4 "${args[@]}" Image.gz-dtb 2>&1 | tee -a ../build.log
          test -s out/arch/arm64/boot/Image.gz-dtb
          sha256sum out/arch/arm64/boot/Image.gz-dtb > ../SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-v2-rekernel-NOT-FOR-FLASHING
          if-no-files-found: warn
          path: |
            port.log
            series.txt
            build.log
            SHA256SUMS
            kernel/out/arch/arm64/boot/Image.gz-dtb
