name: Polaris 4.19 Smoothness Edition build
on:
  push:
    branches: ['codex/polaris-419-smoothness']
    paths: ['pe13-419-r11/**', '.github/workflows/pe13-419-offline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        timeout-minutes: 18
        run: |
          packages=(clang-16 lld-16 llvm-16 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev bc bison flex device-tree-compiler cpio rsync)
          options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          if ! sudo timeout --kill-after=10s 360s apt-get "${options[@]}" install --no-install-recommends -y "${packages[@]}"; then
            sudo timeout --kill-after=10s 120s apt-get "${options[@]}" update
            sudo timeout --kill-after=10s 420s apt-get "${options[@]}" install --no-install-recommends -y "${packages[@]}"
          fi
      - name: Build pinned full kernel and candidate patches
        run: bash pe13-419-r11/scripts/build_linux.sh "$RUNNER_TEMP/pe13-419-build"
      - name: Save build evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polaris-419-smoothness-NOT-FOR-FLASHING
          path: |
            ${{ runner.temp }}/pe13-419-build/*.log
            ${{ runner.temp }}/pe13-419-build/*.json
            ${{ runner.temp }}/pe13-419-build/toolchain.txt
            ${{ runner.temp }}/pe13-419-build/artifacts/
            pe13-419-r11/out/host-checks/*results.json
