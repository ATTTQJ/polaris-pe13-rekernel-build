name: PE13 Polaris 4.19 r15 ZRAM and UFS backports
on:
  push:
    branches: ['codex/polaris-419-io-zram']
    paths: ['pe13-419-r11/**', '.github/workflows/pe13-419-offline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        timeout-minutes: 18
        run: |
          packages=(clang-16 lld-16 llvm-16 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev bc bison flex device-tree-compiler cpio rsync)
          options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Languages=none)
          if ! sudo timeout --kill-after=10s 180s apt-get "${options[@]}" install --no-install-recommends -y "${packages[@]}"; then
            cat > "$RUNNER_TEMP/polaris-ubuntu.sources" <<'SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
            fallback=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/polaris-ubuntu.sources" -o Dir::Etc::sourceparts=-)
            sudo timeout --kill-after=10s 220s apt-get "${options[@]}" "${fallback[@]}" update
            sudo timeout --kill-after=10s 430s apt-get "${options[@]}" "${fallback[@]}" install --no-install-recommends -y "${packages[@]}"
          fi
      - name: Build pinned full kernel and candidate patches
        run: bash pe13-419-r11/scripts/build_linux.sh "$RUNNER_TEMP/pe13-419-build"
      - name: Save build evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pe13-419-r15-NOT-FOR-FLASHING
          path: |
            ${{ runner.temp }}/pe13-419-build/*.log
            ${{ runner.temp }}/pe13-419-build/*.json
            ${{ runner.temp }}/pe13-419-build/toolchain.txt
            ${{ runner.temp }}/pe13-419-build/artifacts/
            pe13-419-r11/out/host-checks/*results.json
